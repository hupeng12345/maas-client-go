version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - misspell
    - nakedret
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-dirs:
    - .gocache
    - .gomodcache
    - .gopath
    - .gotmp
  max-issues-per-linter: 0
  max-same-issues: 0
